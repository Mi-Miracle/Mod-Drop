<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Mod Drop — overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/card.css">
<style>
  /* Параметри URL:  ?key=…  &pos=center|left|right|top|bottom  &scale=1 (0.5–2) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"><div class="md-stage" id="stage"></div></div>
<script src="/assets/render.js"></script>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const KEY = qs.get('key') || '';
  const defaultPos = qs.get('pos') || 'center';
  const cardScale = Math.min(2, Math.max(0.5, parseFloat(qs.get('scale')) || 1));
  const stage = document.getElementById('stage');

  // Сцена 1920×1080 підганяється під розмір Browser Source
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  let current = null, currentKey = null;
  const ended = item => fetch('/overlay/ended?key=' + encodeURIComponent(KEY), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: item.id }),
  }).catch(() => {});

  function show(item) {
    const key = item.id + ':' + item.shownAt;
    if (key === currentKey && current) return;   // повтор після перепідключення
    currentKey = key;
    if (item.notify) MDRender.chime(item.notify.sound, item.notify.volume);
    if (current) current.destroy(false);
    current = MDRender.render(item, stage, { defaultPos, cardScale, onEnded: ended });
  }
  function hide() {
    currentKey = null;
    if (current) { current.destroy(true); current = null; }
  }

  function connect() {
    const es = new EventSource('/overlay/events?key=' + encodeURIComponent(KEY));
    es.addEventListener('show', e => show(JSON.parse(e.data)));
    es.addEventListener('hide', hide);
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  }
  connect();
})();
</script>
</body>
</html>
